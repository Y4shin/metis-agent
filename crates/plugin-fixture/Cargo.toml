# The fixture plugin and the harness that drives it. Test support only: nothing
# outside this crate depends on them, and the crate exists to prove the plugin
# boundary with a real shared library.
[package]
name = "plugin-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "plugin_fixture"
# `cdylib` is the artifact the harness loads. `rlib` lets the harness reuse the
# fixture's payload shapes instead of restating the JSON, without either type
# ever reaching the C ABI surface.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "abi-harness"
path = "src/bin/abi-harness.rs"

[dependencies]
# The fixture is an author, so it turns the authoring feature on; the runtime
# keeps it off and sees the primitives and the payload envelope alone.
plugin-contract = { workspace = true, features = ["authoring"] }
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fixture derives its inline capability schemas, which is what an author
# does with the re-exported derive.
schemars.workspace = true
