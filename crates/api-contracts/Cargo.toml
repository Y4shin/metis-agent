[package]
name = "api-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
connectrpc.workspace = true
buffa = "=0.9.2"

# Generated types and stubs name these directly.
serde = "1"
http = "1"
http-body = "1"

# The handwritten transport module: the listener and connector glue every
# local or remote front-end extends.
tokio.workspace = true
tower.workspace = true
hyper.workspace = true
hyper-util.workspace = true

# The event ring beside the transport: its live subscription is a `Stream`, and
# the serving side assembles the snapshot, that subscription, and the heartbeat
# into one.
futures-util.workspace = true

# The ACL on a Unix socket path: the group is set with `chown`, which `std`
# does not expose.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The named pipe's access control is a Windows object descriptor, built from
# the daemon's own token. It is target-gated, so the Linux dependency tree does
# not carry it.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
