[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
api-contracts.workspace = true
connectrpc.workspace = true

# The skeleton's socket wait names tokio directly; the transport itself lives in
# `api-contracts`.
tokio.workspace = true

# The event stream's response body is the transport's own body type. It is a
# private field of `EventStream`, so no caller names it.
hyper.workspace = true

# The refusal vocabulary is read from response metadata, on the stream's own
# response as well as on a failed call, so the header map type is named here.
http = "1"

# Every stream declares a request identifier of its own, which is what the
# daemon registers the stream's work under; it comes from the operating
# system's random source.
getrandom.workspace = true

[dev-dependencies]
# The loop-seam test drives a duplex stream through the generated client, so it
# needs the connector shape itself.
hyper-util.workspace = true
tower.workspace = true
