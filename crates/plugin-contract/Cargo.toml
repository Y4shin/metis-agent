[package]
name = "plugin-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[build-dependencies]
cc.workspace = true

# The authoring surface is off by default, so `plugin-runtime` depends on the
# primitives and the payload envelope alone. Turning it on adds the serde pair
# the routed `call`'s bodies are serialised with, plus `schemars` for the inline
# capability schemas an author's types imply; with the feature off this crate's
# dependency list is empty, which is what keeps an async runtime out of the
# boundary.
[features]
authoring = ["dep:schemars"]

[dependencies]
# The capability declaration is a JSON payload both sides read, so the serde
# pair is always on. `schemars` is not: only an author derives schemas.
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
