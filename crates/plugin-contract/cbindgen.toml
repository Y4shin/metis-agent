# cbindgen configuration for the plugin ABI header (D2, D13).
#
# `repr(C)` Rust in `crates/plugin-contract/src/abi` is the source of truth;
# this file governs the committed header at `include/metis_plugin_abi.h`, which
# `scripts/regenerate-abi-header.sh` regenerates and CI checks for drift.
language = "C"
include_guard = "METIS_PLUGIN_ABI_H"
pragma_once = true
documentation = true
documentation_style = "doxy"
style = "both"
# `usize` in Rust is `size_t` in C, which is what the layout assertions in
# `src/abi/layout.rs` and `c/layout_static_asserts.c` are written in terms of.
usize_is_size_t = true
cpp_compat = false
tab_width = 4

# Every ABI type must be listed here. A crate whose surface is a table of
# function pointers exports no function for cbindgen to seed its dependency
# graph from, so without this list the header would contain only the constants
# (measured).
[export]
include = [
    "MetisStatus",
    "MetisBuffer",
    "MetisTablePrefix",
    "MetisPluginTableV1",
    "MetisHostApiV1",
    "MetisCreateInstanceFn",
    "MetisDestroyInstanceFn",
    "MetisListCapabilitiesFn",
    "MetisInvokeFutureFn",
    "MetisCancelFn",
    "MetisReleaseBufferFn",
    "MetisShutdownFn",
    "MetisServiceCompleteFn",
    "MetisProgressFn",
    "MetisEmitEventFn",
    "MetisLogFn",
    "MetisServiceRequestFn",
    "MetisFutureHandle",
    "MetisFutureVtable",
    "MetisFuturePollFn",
    "MetisFutureDropFn",
    "MetisWaker",
    "MetisWakerVtable",
    "MetisWakerCloneFn",
    "MetisWakerWakeFn",
    "MetisWakerWakeByRefFn",
    "MetisWakerDropFn",
    "MetisPluginEntryV1Fn",
]

# cbindgen emits every public constant of the crate regardless of the include
# list above (measured), so the two surfaces are kept the same thing from this
# side: the payload envelope constants and the presence slot constants belong in
# the header and are absent here, while every constant that is *not* part of the
# ABI surface is named below.
#
# The three presence thresholds are excluded because cbindgen cannot render
# them at all: they are computed with `size_of`, which it does not evaluate
# (measured, and the same reason the prototype's landed-size constants left
# blank lines in its header). The header carries the slot constants they are
# built from instead, and the C presence predicate is written in terms of
# those.
exclude = [
    "METIS_PLUGIN_TABLE_V1_INVOKE_FUTURE_THRESHOLD",
    "METIS_PLUGIN_TABLE_V1_SERVICE_COMPLETE_THRESHOLD",
    "METIS_HOST_API_V1_SERVICE_REQUEST_THRESHOLD",
]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
rename_args = "None"
