name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` compares the working tree against the `main` branch,
          # so the job needs the branch and its history, not just the commit
          # being built.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27

      - uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install github:cachix/devenv/latest

      - name: Format
        run: devenv shell -- cargo fmt --check

      - name: Clippy
        run: devenv shell -- cargo clippy --all-targets -- -D warnings

      - name: Test
        run: devenv shell -- cargo test

      # Both contract gates run from the repository root, where the one
      # `buf.yaml` lives, so the gate that runs and the policy that is declared
      # cannot read different files.
      - name: Contract lint
        run: devenv shell -- buf lint

      # `--against-config` scopes the `main` side of the comparison with the
      # same root configuration as the working tree, so the two sides line up on
      # `contracts/proto` instead of comparing a module with a whole tree.
      - name: Contract breaking changes
        run: devenv shell -- buf breaking --against '.git#branch=main' --against-config buf.yaml

      - name: Contract regeneration check
        env:
          # The two codegen plugins are BSR remote plugins, so this step
          # resolves them over the network. A configured secret lifts the
          # anonymous rate limit.
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          # An absent secret arrives here as the empty string. Measured on buf
          # 1.73.0: an empty `BUF_TOKEN` is treated like an unset one, while a
          # non-empty token the BSR cannot verify is refused before any plugin
          # resolves. The step does not rely on that distinction: it drops the
          # variable when the secret carries nothing, so buf is either given a
          # real token or no variable at all, and the gate keeps working
          # without authentication.
          if [ -z "${BUF_TOKEN:-}" ]; then unset BUF_TOKEN; fi
          devenv shell -- bash scripts/regenerate-contracts.sh --check

      # The C implementer of the plugin table. The committed header is the
      # artifact a non-Rust author compiles against, so it is compiled under
      # `-std=c11 -Wall -Wextra -Werror` with both gcc and clang before the
      # harness loads the gcc build and drives it end to end.
      - name: C plugin build
        run: devenv shell -- bash scripts/build-c-plugin.sh

      # The contract's layout assertions are compiled by that crate's build
      # script in this host's default C mode, which is not the mode they are
      # compiled in on Windows. This step pins the modes a host build cannot:
      # strict ISO C89 with warnings denied, the closest available bar to the
      # legacy C mode `cl.exe` compiles `.c` files in, and a deliberately
      # broken copy of the file, which must still fail the build.
      - name: C layout assertion check
        run: devenv shell -- bash scripts/check-c-layout-asserts.sh

      # The authoring feature is off by default, and the fixture turns it on,
      # so the workspace build unifies it in and never compiles the feature-off
      # path. This step compiles the crate alone that way, which is the only
      # thing that proves the boundary still stands on the primitives and the
      # payload envelope alone.
      - name: Plugin contract without the authoring feature
        run: devenv shell -- cargo check -p plugin-contract --no-default-features

      # The harness rebuilds the fixture cdylib itself before loading it, so a
      # stale library cannot be loaded even when this step follows a cached
      # build. It prints one line per check and exits non-zero on failure.
      - name: Plugin ABI harness
        run: devenv shell -- cargo run -p plugin-fixture --bin abi-harness

      - name: Plugin ABI header regeneration check
        run: devenv shell -- bash scripts/regenerate-abi-header.sh --check

      # The `no_panic` assertion over the host's four callback hand-off frames.
      # It is a link-time check, so it needs a linker; it needs `panic =
      # "unwind"`, so it cannot run in a profile that aborts; and it needs the
      # compiler to see the frames with optimization, so it selects the
      # workspace's `no-panic` profile at `opt-level = 1`. This step is the one
      # place the assertion holds, and `docs/testing.md` records what it proves
      # and what it does not.
      - name: Plugin host callback panic-free check
        run: devenv shell -- cargo test --profile no-panic -p plugin-runtime --features no-panic-check --no-run

  # The Windows half of the local transport is compiled, never run: no runner in
  # this effort executes a named-pipe test, so the evidence this job produces is
  # compilation for the Windows target. `--all-targets` is what compiles the
  # pipe test binary (`crates/api-contracts/tests/pipe.rs`) and therefore the
  # serve-and-connect test with it; the gap that leaves is recorded, with the
  # invocation that would close it, in `docs/testing.md`.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # devenv is a Linux shell, so this job installs the same toolchain channel
      # devenv pins for itself.
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Compile the Windows transport
        # `daemon` reaches `plugin-runtime`, which pulls in `plugin-contract`,
        # whose build script compiles `c/layout_static_asserts.c` with MSVC.
        # That file used to be rejected there before any Rust was
        # type-checked, so this job checked `api-contracts` alone. The layout
        # assertions are now written in the C89 subset MSVC's legacy C mode
        # accepts, so the daemon and the plugin line join the job. This step's
        # first run on a runner with MSVC is what proves it, because no local
        # invocation here can. Measured on the effort's Linux host with the
        # Windows target: `api-contracts` and `client` both check clean, while
        # `daemon` stops in the nix-wrapped clang, which refuses that target
        # itself, for this C file and for `libsqlite3-sys`'s `sqlite3.c`.
        run: cargo +nightly check -p api-contracts -p daemon --all-targets
