name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install github:cachix/devenv/latest

      - name: Format
        run: devenv shell -- cargo fmt --check

      - name: Clippy
        run: devenv shell -- cargo clippy --all-targets -- -D warnings

      - name: Test
        run: devenv shell -- cargo test
