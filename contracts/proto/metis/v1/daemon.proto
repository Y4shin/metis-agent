// The daemon's wire contract, first version.
//
// Three ordinary RPCs, the event stream, and cancellation. Changing or removing
// what is here already breaks clients, and `buf breaking` in FILE mode is the
// gate that catches it.

syntax = "proto3";

package metis.v1;

// The daemon's first service version.
service DaemonService {
  // Echo a message back, with the time the daemon received it.
  rpc Echo(EchoRequest) returns (EchoResponse);

  // Pair a surface with the daemon's preshared key, and answer with the
  // surface's own token. The key travels in the request body and nowhere
  // else, and the token is answered once: the daemon keeps only its hash.
  rpc Pair(PairRequest) returns (PairResponse);

  // Stream the daemon's events for the selected channels. A stream opened
  // without a cursor begins with the snapshot of each selected channel's head;
  // a stream opened with a cursor begins with the events that follow it, in
  // identifier order. Later messages carry what is published while the stream
  // is open, and an idle stream carries heartbeats as ordinary messages. The
  // response is the event itself rather than a named response wrapper, which is
  // why this RPC carries the one lint exception in `buf.yaml`.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);

  // Stop the in-flight work a caller started under the request identifier it
  // declared. The call is idempotent: it stops what is in flight and reports
  // whether anything was, so a caller that repeats it is answered rather than
  // refused. Work is keyed by the declaring surface and the identifier, so a
  // cancel stops only work its own surface started.
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

message EchoRequest {
  // The text to echo.
  string message = 1;
}

message EchoResponse {
  // The text that was echoed.
  string message = 1;

  // When the daemon received the request, as an RFC 3339 string.
  string received_at = 2;
}

message PairRequest {
  // The daemon's preshared key, in the form the daemon's configuration
  // resolves: a literal, an environment reference, a keystore reference, or a
  // secret-file reference. This is the one place a secret travels in a message
  // body; the credential it answers with never does.
  string preshared_key = 1;
}

message PairResponse {
  // The surface's token, returned once. The daemon stores only its hash, so
  // this response is the only time the token exists in the daemon's memory.
  string token = 1;
}

// The channels one stream selects, and where it starts.
message StreamEventsRequest {
  // The channels to stream, of the daemon's `daemon`, `session:<id>`,
  // `task:<id>`, and `workflow_run:<id>` vocabulary. An empty selection
  // starts a stream that carries nothing but heartbeats, because a typo
  // must not leak every channel.
  repeated string channels = 1;

  // The event to resume after. `0` means no cursor, and identifiers start
  // at `1`, so the field needs no `optional`. A non-zero cursor resumes after
  // that identifier: the ring replays what it still holds after it, in
  // identifier order, and the stream carries no snapshot. A cursor the ring
  // can no longer serve is refused before the stream opens, through the
  // `metis-cursor-error: expired` response header, and the caller answers by
  // opening a cursorless stream, which begins with the snapshot.
  uint64 last_event_id = 2;
}

// The request identifier whose work should stop.
message CancelRequest {
  // The identifier the work declared as request metadata, in the spelling the
  // `metis-request-id` header carries: at most 64 bytes, every byte in
  // `0x21..=0x7E`. An identifier this daemon cannot act on is refused as an
  // invalid argument rather than treated as work that was never seen.
  string request_id = 1;
}

// What a cancel call did.
message CancelResponse {
  // Whether anything was in flight under the identifier.
  CancelOutcome outcome = 1;
}

// One message on an event stream: the snapshot that opens a stream with no
// cursor, an event a stream replays or carries live, or a heartbeat.
message Event {
  // The event's identifier, monotonic across every channel of the daemon and
  // starting at `1`.
  uint64 id = 1;

  // What this message is.
  EventKind kind = 2;

  // The channel the event belongs to, in the `StreamEventsRequest.channels`
  // vocabulary. A heartbeat carries no channel: it belongs to the stream, not
  // to a channel.
  string channel = 3;

  // The event's structured content, as JSON text.
  //
  // The field is a `string` rather than a well-known type or a generated
  // message, so that neither generation nor the runtime pulls a schema or
  // well-known-type dependency in for payloads the stream treats as opaque.
  // A more native encoding can replace it only by breaking the compatibility
  // gate, because `buf breaking` runs in FILE mode and this is field 4 of a
  // committed message.
  string payload = 4;
}

// What one message on an event stream is.
enum EventKind {
  // Not set. A receiver treats it as a message it cannot act on.
  EVENT_KIND_UNSPECIFIED = 0;

  // The opening message of a stream that carries no cursor. A selected channel
  // that holds an event contributes its head, and when no selected channel
  // holds anything the snapshot is one empty message: no channel, no payload,
  // and the daemon's latest identifier. A resumed stream carries no snapshot at
  // all: it opens with the events that follow its cursor instead, because its
  // caller already holds the state a snapshot would restate.
  EVENT_KIND_SNAPSHOT = 1;

  // A liveness message on an otherwise idle stream. It carries the id of the
  // most recent event the daemon assigned and no channel, so identifiers never
  // decrease across a stream's whole life.
  EVENT_KIND_HEARTBEAT = 2;

  // A published event.
  EVENT_KIND_EVENT = 3;
}

// What a cancel call did.
enum CancelOutcome {
  // Not set. A receiver treats it as an answer it cannot act on.
  CANCEL_OUTCOME_UNSPECIFIED = 0;

  // An in-flight request under that identifier was found and is being stopped.
  // What the work already published stays published: cancellation stops work,
  // it does not undo it.
  CANCEL_OUTCOME_CANCELLED = 1;

  // Nothing was in flight under that identifier: the work finished, was already
  // cancelled, or was never seen. A caller reads this as "already finished",
  // which is what makes a repeated cancel idempotent and what keeps the answer
  // from telling a caller whether an identifier it does not own exists.
  CANCEL_OUTCOME_ALREADY_FINISHED = 2;
}
