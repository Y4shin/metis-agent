# Root Cargo workspace. Crates live under `crates/` and are listed explicitly
# in `members` as they appear. Inter-crate path dependencies encode the
# dependency direction agreed in `docs/rough-plan.md`.
[workspace]
resolver = "3"
members = [
    "crates/agent-harness",
    "crates/workflow",
    "crates/plugin-contract",
    "crates/plugin-runtime",
    # The fixture cdylib and its harness: test support for the plugin boundary.
    "crates/plugin-fixture",
    "crates/api-contracts",
    "crates/client",
    "crates/daemon",
    "crates/terminal",
    "crates/app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Y4shin/metis-agent"

[workspace.lints.clippy]
all = "warn"

# The bootstrap wires inter-crate path dependencies before any crate has
# content, so `unused_dependencies` is noise until the first real code lands.
[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.dependencies]
agent-harness = { path = "crates/agent-harness" }
workflow = { path = "crates/workflow" }
plugin-contract = { path = "crates/plugin-contract" }
plugin-runtime = { path = "crates/plugin-runtime" }
plugin-fixture = { path = "crates/plugin-fixture" }
api-contracts = { path = "crates/api-contracts" }
client = { path = "crates/client" }

# Third-party dependencies shared by the plugin boundary crates. `cc` compiles
# the C translation unit that re-asserts the ABI layout, `libloading` loads the
# fixture cdylib in the ABI harness, and the serde pair keeps the fixture's
# serialisation shapes out of the C ABI surface.
cc = "1"
libloading = "0.9"
# The socket ACL sets a directory's and a socket file's group, which `std`
# does not expose. It is a direct dependency of `api-contracts` only, and only
# on Unix.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The authoring surface derives inline capability schemas with `schemars`, and
# `plugin-runtime` validates payloads against them with `jsonschema`. The
# `jsonschema` defaults pull in `reqwest` and `rustls`, which a boundary that
# validates local bytes does not need.
schemars = "1"
jsonschema = { version = "0.58", default-features = false }

# The pre-1.0 protocol pair moves together and is pinned exactly; the committed
# generated code is produced against these versions. Both the generated tree and
# the handwritten transport name it, so the pin lives here once.
connectrpc = { version = "=0.9.1", default-features = false, features = [
    "client",
    "server",
    "json",
] }

# The daemon's persistent state: one SQLite database through `sqlx`'s runtime
# API, with the schema applied by the migrator embedded on open. The feature set
# is the minimum for that: the tokio runtime, the bundled SQLite driver, and the
# `migrate!` macro. No TLS stack, no `DATABASE_URL`, no database server, and no
# compile-time query macros.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# The per-surface credential: `getrandom` supplies the 32 random bytes a token
# is made of, `sha2` hashes it, and `subtle` compares a stored hash with a
# presented one in constant time rather than with a short-circuiting `==`.
getrandom = "0.4"
sha2 = "0.11"
subtle = "2"

# The local transport's async runtime and HTTP stack. These follow their major
# line; only the protocol pair above is pinned exactly. The tokio features are
# the ones the listener, the connector, and the tests actually name.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "time",
] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "service",
    "server-auto",
    "tokio",
] }
