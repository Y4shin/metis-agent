# cbindgen configuration for the prototype ABI header (lane 3).
#
# `repr(C)` Rust in `crates/proto-abi/src/lib.rs` is the source of truth. This
# file governs the committed header at `include/metis_plugin_abi.h`, which is
# regenerated by hand from the crate and compiled on every build by `build.rs`.
#
# It mirrors `crates/plugin-contract/cbindgen.toml`, with the new host-polled
# future types and the two appended table entries added to the export list.
language = "C"
include_guard = "METIS_PLUGIN_ABI_H"
pragma_once = true
documentation = true
documentation_style = "doxy"
style = "both"
# `usize` in Rust is `size_t` in C, which is what the layout assertions in
# `src/layout.rs` and `c/layout_static_asserts.c` are written in terms of.
usize_is_size_t = true
cpp_compat = false
tab_width = 4

# Every ABI type must be listed here. A crate whose surface is a table of
# function pointers exports no function for cbindgen to seed its dependency
# graph from, so without this list the header would contain only the constants.
[export]
include = [
    "MetisStatus",
    "MetisBuffer",
    "MetisTablePrefix",
    "MetisPluginTableV1",
    "MetisHostApiV1",
    "MetisCreateInstanceFn",
    "MetisDestroyInstanceFn",
    "MetisListCapabilitiesFn",
    "MetisInvokeFn",
    "MetisCancelFn",
    "MetisReleaseBufferFn",
    "MetisShutdownFn",
    "MetisCompleteFn",
    "MetisProgressFn",
    "MetisEmitEventFn",
    "MetisLogFn",
    "MetisPluginEntryV1Fn",
    # Appended (lane 3): the host-polled future seam.
    "MetisFutureHandle",
    "MetisFutureVtable",
    "MetisFuturePollFn",
    "MetisFutureDropFn",
    "MetisWaker",
    "MetisWakerVtable",
    "MetisWakerCloneFn",
    "MetisWakerWakeFn",
    "MetisWakerWakeByRefFn",
    "MetisWakerDropFn",
    "MetisInvokeFutureFn",
    "MetisServiceCompleteFn",
    "MetisServiceRequestFn",
]

# The payload envelope lives alongside the ABI surface but is deliberately not
# part of it; cbindgen emits every public constant of the crate regardless of
# the include list above, so the exclusion is what keeps the two surfaces the
# same thing.
exclude = [
    "METIS_PAYLOAD_VERSION",
    "METIS_PAYLOAD_CODEC_JSON",
    "METIS_PAYLOAD_CODEC_BIT",
    "METIS_PAYLOAD_RESERVED_MASK",
]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
rename_args = "None"
